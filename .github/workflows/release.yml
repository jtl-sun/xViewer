name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from mdir import __version__; print(__version__)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Tag does not match package version'
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Compile
        run: python -m compileall -q mdir tests tools
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Self-check
        run: python -m mdir --check
      - name: Build wheel and source distribution
        run: python -m build
      - name: Build Windows ZIP and checksums
        run: python tools/package_release.py
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: xViewer ${{ steps.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/xViewer-*.zip
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
