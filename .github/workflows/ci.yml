name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q mdir tests tools

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Self-check
        run: python -m mdir --check

      - name: Build package
        run: python -m build

      - name: Build clean Windows release ZIP
        if: matrix.python-version == '3.12'
        run: python tools/package_release.py

      - name: Upload build artifacts
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: xViewer-build
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/xViewer-*.zip
            dist/SHA256SUMS.txt
